<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StudyLog</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Welcome to StudyLog!</h1>
    <p>Your personal study tracker.</p>
    <div class="timer-card"></div>
    <h2>Study Timer</h2>

    <label for="subjectInput">Study Subject:</label>
    <input type="text" id="subjectInput" placeholder="Enter subject">

    <label for="durationInput">Study Duration (minutes):</label>
    <input type="number" id="durationInput" value="25" min="1">
    <p id="timerDisplay">25:00</p>

    <div class="progress-card">
    <p id="sessionCount">Completed Sessions: 0</p>
    <p id="totalStudyTime">Total Studied Time: 0 minutes</p>
   
    </div>
    <button id="startBtn">Start Studying</button>
    <button id="pauseBtn">Pause</button>
    <button id="resetBtn">Reset</button>
    <button id="endBtn">End Session</button>
    </div>

   <div class="history-card"></div>

    <h2>Study History</h2>

    <label for="historyDate">Select Date:</label>
    <input type="date" id="historyDate">

<ul id="historyList"></ul>
</div>



<div class="daily-quote-card">
    <h2>✿ Today's Little Reminder ✿</h2>
    <p id="dailyQuote"></p>
    <p>♡ One day at a time ♡</p>
</div>

    


    <script src="script.js"></script>
</body>
</html>
